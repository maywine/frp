# Add this map and server inside the nginx stream context.
map $ssl_preread_server_name $tunnel_backend {
    tunnel.example.com web_tls;
    app.example.com    web_tls;
    default            web_tls;
}

upstream web_tls {
    server 127.0.0.1:8443;
}

server {
    listen 443;
    ssl_preread on;
    proxy_pass $tunnel_backend;
}

# Add the remaining directives inside the nginx http context.
map $http_upgrade $tunnel_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name tunnel.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location = /api/v1/events {
        proxy_pass http://127.0.0.1:4002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $tunnel_connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}

server {
    listen 127.0.0.1:8443 ssl;
    server_name app.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/private.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
